<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Navbar</title>
<style>
  :root{
    --ink:#1c1c1c;
    --bg:#ffffff;
    --accent:#2f5d50;
    --line:#e7e7e7;
    --hover:#f3f5f4;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:Arial, Helvetica, sans-serif;
    color:var(--ink);
  }

  /* ===== NAVBAR ===== */
  .navbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:16px 24px;
    position:relative;
  }

  .brand{
    font-size:1.25rem;
    font-weight:bold;
    color:var(--accent);
    text-decoration:none;
    letter-spacing:0.3px;
  }

  /* Desktop links */
  .nav-links{
    list-style:none;
    display:flex;
    gap:8px;
  }
  .nav-links a{
    display:block;
    padding:10px 16px;
    text-decoration:none;
    color:var(--ink);
    font-size:0.95rem;
    border-radius:4px;
    transition:background 0.2s ease, color 0.2s ease;
  }
  .nav-links a:hover{
    background:var(--hover);
    color:var(--accent);
  }

  /* Hide checkbox + hamburger label by default (desktop) */
  .menu-toggle{ display:none; }
  .hamburger{
    display:none;
    flex-direction:column;
    justify-content:space-between;
    width:26px;
    height:19px;
    cursor:pointer;
  }
  .hamburger span{
    display:block;
    height:3px;
    width:100%;
    background:var(--ink);
    border-radius:2px;
    transition:transform 0.3s ease, opacity 0.3s ease;
  }

  /* ===== MOBILE ===== */
  @media (max-width:768px){
    .hamburger{ display:flex; }

    .nav-links{
      position:absolute;
      top:100%;
      left:0;
      right:0;
      flex-direction:column;
      gap:0;
      background:var(--bg);
      border-bottom:1px solid var(--line);
      max-height:0;
      overflow:hidden;
      transition:max-height 0.35s ease;
    }
    .nav-links a{
      border-radius:0;
      padding:14px 24px;
      border-top:1px solid var(--line);
    }

    /* Toggle behavior via checkbox */
    .menu-toggle:checked ~ .nav-links{
      max-height:400px;
    }

    /* Animate hamburger into an X when checked */
    .menu-toggle:checked ~ .hamburger span:nth-child(1){
      transform:translateY(8px) rotate(45deg);
    }
    .menu-toggle:checked ~ .hamburger span:nth-child(2){
      opacity:0;
    }
    .menu-toggle:checked ~ .hamburger span:nth-child(3){
      transform:translateY(-8px) rotate(-45deg);
    }
  }
</style>
</head>
<body>

<nav class="navbar">
  <a href="#" class="brand">Navbar</a>

  <!-- checkbox drives the toggle, no JS needed -->
  <input type="checkbox" id="menu-toggle" class="menu-toggle">

  <label for="menu-toggle" class="hamburger" aria-label="Toggle navigation menu">
    <span></span>
    <span></span>
    <span></span>
  </label>

  <ul class="nav-links">
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Services</a></li>
    <li><a href="#">Projects</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</nav>

<main style="padding:40px 24px;">
  <p>Page content goes here. Resize the window or open on mobile to see the hamburger menu toggle.</p>
</main>

</body>
</html>
